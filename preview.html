<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Support Ticket System - Live Preview</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #090d16;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.10) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(14, 165, 233, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: #f1f5f9;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [tab, setTab] = useState('user');
      const [subject, setSubject] = useState('');
      const [desc, setDesc] = useState('');
      const [result, setResult] = useState(null);
      const [threshold, setThreshold] = useState(0.85);

      const samplePrompts = [
        { title: "Account Lockout", subject: "Locked out of account - reset password", desc: "Entered wrong password 3 times. Account locked. Email: user@company.com Phone: 555-019-2831" },
        { title: "Double Charge Refund", subject: "Charged twice for monthly invoice #INV-8821", desc: "Credit card 4532-1100-8899-0021 charged twice. Please refund $299." },
        { title: "Technical 403 Error", subject: "Custom API returning HTTP 403 Forbidden", desc: "Webhooks failing with 403 Forbidden after deployment. Request ID x-req-9921." },
        { title: "Vacation PTO Balance", subject: "Check remaining PTO vacation leave balance", desc: "How many vacation leave days do I have left for December?" }
      ];

      const handleSample = (p) => {
        setSubject(p.subject);
        setDesc(p.desc);
        setResult(null);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const text = `${subject} ${desc}`.toLowerCase();
        let cat = "Technical & Infrastructure";
        let conf = 0.72;
        let kbTitle = "Troubleshooting API Errors & Outages";
        let kbContent = "1. Verify API headers.\n2. Check status page.\n3. Verify rate limits.";

        if (text.includes("password") || text.includes("account") || text.includes("locked")) {
          cat = "Account Access";
          conf = 0.94;
          kbTitle = "Self-Service Guide: Password Reset & SSO";
          kbContent = "Reset your password at https://auth.company.com/reset-password or enter 16-digit backup code.";
        } else if (text.includes("charge") || text.includes("refund") || text.includes("invoice")) {
          cat = "Billing & Refunds";
          conf = 0.91;
          kbTitle = "Billing FAQ: Invoices & Refund Policy";
          kbContent = "Subscriptions cancelled within 14 days receive 100% full refund within 3-5 days.";
        } else if (text.includes("pto") || text.includes("vacation") || text.includes("leave")) {
          cat = "HR & Leave Balance";
          conf = 0.96;
          kbTitle = "HR Portal Guide: Vacation Balance & PTO";
          kbContent = "Log into Workday HR Portal > Time Off & Leave to view accrued PTO balance.";
        }

        const isAuto = conf >= threshold;
        setResult({
          id: "tkt_" + Math.random().toString(36).substr(2, 6),
          subject,
          category: cat,
          confidence: conf,
          confidencePct: `${Math.round(conf * 100)}%`,
          autoResolved: isAuto,
          pii: text.includes("@") || text.includes("-"),
          sourceKb: kbTitle,
          response: `Hello,\n\nThank you for reaching out regarding "${subject}".\n\nBased on our ${cat} KB ("${kbTitle}"):\n\n${kbContent}\n\nReference KB Article: ${kbTitle}\n*Auto-Generated by Gemini / OpenAI RAG System*`
        });
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="glass-panel sticky top-0 z-50 border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">
                  ⚡
                </div>
                <div>
                  <h1 className="font-bold text-base text-white tracking-tight">AI Support Ticket System</h1>
                  <p className="text-xs text-slate-400">RAG Response & Intent Classification Platform</p>
                </div>
              </div>

              <div className="hidden sm:flex items-center space-x-3 text-xs">
                <div className="bg-slate-900 border border-slate-800 rounded-lg px-3 py-1 text-slate-300">
                  Mode: <strong className="text-emerald-400">Gemini / OpenAI API</strong>
                </div>
                <div className="bg-slate-900 border border-slate-800 rounded-lg px-3 py-1 text-slate-300">
                  Auto-Send Threshold: <strong className="text-indigo-300">{Math.round(threshold * 100)}%</strong>
                </div>
              </div>

              <nav className="flex space-x-2">
                {[
                  { id: 'user', label: 'Submit Ticket' },
                  { id: 'agent', label: 'Agent Console' },
                  { id: 'admin', label: 'KB & Settings' },
                  { id: 'analytics', label: 'Analytics' }
                ].map(t => (
                  <button
                    key={t.id}
                    onClick={() => setTab(t.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                      tab === t.id ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'
                    }`}
                  >
                    {t.label}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* Main Body */}
          <main className="max-w-5xl w-full mx-auto p-6 flex-1 space-y-6">
            
            {tab === 'user' && (
              <div className="space-y-6">
                <div className="glass-panel p-6 rounded-2xl">
                  <span className="text-xs font-bold text-indigo-400 uppercase tracking-wider">Automated Support System</span>
                  <h2 className="text-2xl font-extrabold text-white mt-1">Submit a Support Inquiry</h2>
                  <p className="text-slate-400 text-xs mt-1">Common issues (password reset, billing, vacation balance) are resolved instantly by AI.</p>
                </div>

                <div className="space-y-2">
                  <span className="text-xs text-slate-400 font-bold uppercase">Click Quick Test Prompts:</span>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    {samplePrompts.map((p, i) => (
                      <button key={i} onClick={() => handleSample(p)} className="glass-card p-3 rounded-xl text-left hover:border-indigo-500/50">
                        <div className="text-xs font-bold text-indigo-300">{p.title}</div>
                        <div className="text-[11px] text-slate-400 truncate mt-0.5">{p.subject}</div>
                      </button>
                    ))}
                  </div>
                </div>

                <form onSubmit={handleSubmit} className="glass-panel p-6 rounded-2xl space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Subject</label>
                    <input
                      type="text"
                      required
                      value={subject}
                      onChange={e => setSubject(e.target.value)}
                      placeholder="e.g. Locked out of account"
                      className="w-full glass-input px-4 py-2.5 rounded-xl text-xs"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-300 uppercase mb-1">Description</label>
                    <textarea
                      required
                      rows={4}
                      value={desc}
                      onChange={e => setDesc(e.target.value)}
                      placeholder="Details of your request..."
                      className="w-full glass-input p-4 rounded-xl text-xs resize-none"
                    />
                  </div>

                  <button type="submit" className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg shadow-indigo-500/20">
                    Submit Ticket to AI Pipeline
                  </button>
                </form>

                {result && (
                  <div className={`glass-panel p-6 rounded-2xl border-2 ${result.autoResolved ? 'border-emerald-500/50' : 'border-amber-500/50'}`}>
                    <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                      <div>
                        <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold uppercase ${result.autoResolved ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}`}>
                          {result.autoResolved ? '⚡ Instant Auto-Resolution' : '⏳ Agent Queue Routing'}
                        </span>
                        <h3 className="text-base font-bold text-white mt-2">{result.subject}</h3>
                      </div>
                      <div className="text-right">
                        <div className="text-xs text-slate-400">Confidence</div>
                        <div className="text-xl font-bold font-mono text-indigo-400">{result.confidencePct}</div>
                        <div className="text-xs text-slate-300">{result.category}</div>
                      </div>
                    </div>

                    {result.pii && (
                      <div className="my-3 bg-indigo-950/40 border border-indigo-500/30 rounded-xl p-2.5 text-xs text-indigo-300">
                        🔒 <strong>PII Redacted:</strong> Sensitive personal information was stripped before model processing.
                      </div>
                    )}

                    <div className="mt-4 bg-slate-900/90 border border-slate-800 p-4 rounded-xl font-mono text-xs text-slate-200 whitespace-pre-wrap">
                      {result.response}
                    </div>
                  </div>
                )}
              </div>
            )}

            {tab === 'agent' && (
              <div className="glass-panel p-6 rounded-2xl space-y-4">
                <h3 className="text-lg font-bold text-white">Support Agent Review Desk</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                  <div className="bg-slate-900 p-4 rounded-xl space-y-2 border border-slate-800">
                    <span className="font-bold text-indigo-400 uppercase">Incoming Ticket (Low Confidence)</span>
                    <p className="text-slate-300">"Custom API webhooks failing with 403 Forbidden after deployment."</p>
                    <div className="text-slate-400">Confidence: <strong className="text-amber-400">72% (Requires Agent Review)</strong></div>
                  </div>
                  <div className="bg-slate-900 p-4 rounded-xl space-y-2 border border-slate-800">
                    <span className="font-bold text-purple-400 uppercase">AI Draft Response (Editable)</span>
                    <textarea className="w-full bg-slate-950 p-2 rounded text-xs border border-slate-800 resize-none font-mono text-slate-200" rows={4} defaultValue="Please verify API request headers and check rate limit limits." />
                    <button className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded font-bold">Approve & Send</button>
                  </div>
                </div>
              </div>
            )}

            {tab === 'admin' && (
              <div className="glass-panel p-6 rounded-2xl space-y-4">
                <h3 className="text-lg font-bold text-white">System Settings & Knowledge Base Manager</h3>
                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
                  <div className="flex justify-between text-xs">
                    <span className="font-bold text-slate-300">System Auto-Send Confidence Threshold:</span>
                    <span className="text-indigo-400 font-mono font-bold">{Math.round(threshold * 100)}%</span>
                  </div>
                  <input type="range" min="0.50" max="0.95" step="0.05" value={threshold} onChange={e => setThreshold(parseFloat(e.target.value))} className="w-full accent-indigo-500" />
                </div>
              </div>
            )}

            {tab === 'analytics' && (
              <div className="glass-panel p-6 rounded-2xl space-y-4">
                <h3 className="text-lg font-bold text-white">AI Accuracy & Operational Metrics</h3>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <div className="text-xs text-slate-400">Auto-Resolution Rate</div>
                    <div className="text-2xl font-bold text-emerald-400 font-mono mt-1">66.2%</div>
                  </div>
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <div className="text-xs text-slate-400">Classification Accuracy</div>
                    <div className="text-2xl font-bold text-indigo-400 font-mono mt-1">93.8%</div>
                  </div>
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <div className="text-xs text-slate-400">First Response Latency</div>
                    <div className="text-2xl font-bold text-purple-400 font-mono mt-1">1.4s</div>
                  </div>
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <div className="text-xs text-slate-400">CSAT Score</div>
                    <div className="text-2xl font-bold text-amber-400 font-mono mt-1">4.85 / 5</div>
                  </div>
                </div>
              </div>
            )}

          </main>

          <footer className="glass-panel border-t border-slate-800 p-4 text-center text-xs text-slate-500">
            Enterprise AI Support Ticket System &copy; 2026
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
